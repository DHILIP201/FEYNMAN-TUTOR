services:
  # 1. Primary FastAPI Web Service
  - type: web
    name: feynman-ai-tutor
    env: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: feynman-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false

  # 2. Celery Background Worker Service
  - type: worker
    name: feynman-celery-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A jobs.celery_app worker --loglevel=info -c 4"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feynman-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # 3. Celery Beat Scheduler Service
  - type: worker
    name: feynman-celery-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A jobs.celery_app beat --loglevel=info"
    autoDeploy: true
    envVars:
      - key: REDIS_URL
        sync: false

databases:
  # Managed PostgreSQL Production Database
  - name: feynman-db
    plan: free

